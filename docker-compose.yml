version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: careloop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careloop}
      POSTGRES_USER: ${POSTGRES_USER:-careloop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careloop_secure_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/sql/triggers.sql:/docker-entrypoint-initdb.d/02_triggers.sql
      - ./backend/sql/rls_policies.sql:/docker-entrypoint-initdb.d/03_rls.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careloop_user -d careloop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careloop_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://careloop_user:careloop_secure_password_2026@db:5432/careloop
      SECRET_KEY: ${SECRET_KEY:-careloop_jwt_secret_future_health_challenge_2026}
      AI_ENABLED: "false"
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careloop_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
